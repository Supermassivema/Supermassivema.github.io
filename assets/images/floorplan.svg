<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .wall { fill: none; stroke: #1a1a1a; stroke-width: 5; stroke-linecap: square; }
      .wall-int { fill: none; stroke: #1a1a1a; stroke-width: 3.5; stroke-linecap: square; }
      .door-arc { fill: none; stroke: #aaa; stroke-width: 1.2; stroke-dasharray: 3,2; }
      .door-leaf { fill: none; stroke: #aaa; stroke-width: 1.5; }
      .dim-line { fill: none; stroke: #b0b0b0; stroke-width: 0.7; }
      .dim-tick { fill: none; stroke: #b0b0b0; stroke-width: 0.7; }
      .dim-text { font-size: 10px; fill: #999; text-anchor: middle; font-weight: 400; }
      .room-label { font-size: 13px; fill: #1a1a1a; text-anchor: middle; font-weight: 700; letter-spacing: 0.08em; }
      .room-sub { font-size: 9px; fill: #aaa; text-anchor: middle; font-weight: 400; }
      .room-fill-gallery { fill: #f5f2eb; }
      .room-fill-cafe { fill: #eef2e8; }
      .room-fill-util { fill: #f0f0f0; }
      .room-fill-office { fill: #ebe8f0; }
      .title-text { font-size: 14px; fill: #1a1a1a; font-weight: 800; letter-spacing: 0.15em; }
      .legend-text { font-size: 9px; fill: #666; }
      .wall-id { font-size: 7px; fill: #cc8855; text-anchor: middle; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- ====== OUTER WALLS ====== -->
  <line x1="80" y1="70" x2="1080" y2="70" class="wall"/>
  <line x1="80" y1="490" x2="1080" y2="490" class="wall"/>
  <line x1="80" y1="70" x2="80" y2="490" class="wall"/>
  <line x1="1080" y1="70" x2="1080" y2="490" class="wall"/>

  <!-- ====== CENTER HORIZONTAL WALL ====== -->
  <!-- Left portion -->
  <line x1="80" y1="270" x2="170" y2="270" class="wall-int"/>
  <!-- gap (door to corridor from left) -->
  <line x1="240" y1="270" x2="350" y2="270" class="wall-int"/>
  <line x1="350" y1="270" x2="440" y2="270" class="wall-int"/>
  <!-- gap (center passage) -->
  <line x1="510" y1="270" x2="580" y2="270" class="wall-int"/>
  <!-- gap (passage) -->
  <line x1="640" y1="270" x2="710" y2="270" class="wall-int"/>
  <!-- gap (door) -->
  <line x1="770" y1="270" x2="1080" y2="270" class="wall-int"/>

  <!-- ====== TOP ROW VERTICAL WALLS ====== -->
  <!-- Wall: top-left room right side -->
  <line x1="350" y1="70" x2="350" y2="270" class="wall-int"/>

  <!-- Center cluster small rooms -->
  <line x1="440" y1="70" x2="440" y2="270" class="wall-int"/>
  <line x1="510" y1="70" x2="510" y2="270" class="wall-int"/>

  <!-- Horizontal divider inside center cluster -->
  <line x1="350" y1="165" x2="440" y2="165" class="wall-int"/>
  <line x1="440" y1="175" x2="510" y2="175" class="wall-int"/>

  <!-- Wall: between center cluster and top-right room -->
  <line x1="580" y1="70" x2="580" y2="165" class="wall-int"/>
  <!-- gap (door opening) -->
  <line x1="580" y1="220" x2="580" y2="270" class="wall-int"/>

  <!-- ====== BOTTOM ROW VERTICAL WALLS ====== -->
  <!-- Wall: bottom-left entry area -->
  <line x1="200" y1="270" x2="200" y2="490" class="wall-int"/>

  <!-- Wall: separating bottom rooms -->
  <line x1="380" y1="270" x2="380" y2="490" class="wall-int"/>

  <!-- Stub walls from center (bottom room dividers) -->
  <line x1="540" y1="380" x2="540" y2="490" class="wall-int"/>
  <line x1="540" y1="270" x2="540" y2="320" class="wall-int"/>

  <line x1="700" y1="270" x2="700" y2="490" class="wall-int"/>

  <!-- ====== DOOR ARCS ====== -->
  <!-- Left exterior door (bottom-left) -->
  <path d="M 80 320 A 55 55 0 0 1 80 375" class="door-arc"/>
  <line x1="80" y1="320" x2="110" y2="345" class="door-leaf"/>

  <!-- Door: corridor left to top-left room -->
  <path d="M 170 270 A 70 70 0 0 0 240 270" class="door-arc"/>
  <line x1="170" y1="270" x2="175" y2="263" class="door-leaf"/>

  <!-- Door: top-left room to center -->
  <path d="M 350 120 A 50 50 0 0 1 350 170" class="door-arc"/>
  <line x1="350" y1="120" x2="355" y2="125" class="door-leaf"/>

  <!-- Small door in center cluster -->
  <path d="M 460 175 A 30 30 0 0 0 490 175" class="door-arc"/>

  <!-- Door: top-right room (cafe) from center -->
  <path d="M 580 165 A 55 55 0 0 0 580 220" class="door-arc"/>
  <line x1="580" y1="165" x2="585" y2="170" class="door-leaf"/>

  <!-- Door: center passage bottom -->
  <path d="M 440 270 A 70 70 0 0 1 510 270" class="door-arc"/>

  <!-- Door: bottom passage -->
  <path d="M 640 270 A 70 70 0 0 0 710 270" class="door-arc"/>

  <!-- Door: bottom-left room -->
  <path d="M 200 330 A 60 60 0 0 1 200 390" class="door-arc"/>
  <line x1="200" y1="330" x2="205" y2="335" class="door-leaf"/>

  <!-- Right exterior door -->
  <path d="M 1080 340 A 55 55 0 0 0 1080 395" class="door-arc"/>
  <line x1="1080" y1="340" x2="1075" y2="345" class="door-leaf"/>

  <!-- ====== ROOM FILLS ====== -->
  <!-- Top-left: Gallery -->
  <rect x="83" y="73" width="264" height="194" class="room-fill-gallery" opacity="0.6"/>

  <!-- Center cluster: WC / Utility (smallest rooms - excluded) -->
  <rect x="353" y="73" width="84" height="89" class="room-fill-util" opacity="0.5"/>
  <rect x="353" y="168" width="84" height="99" class="room-fill-util" opacity="0.5"/>
  <rect x="443" y="73" width="64" height="99" class="room-fill-util" opacity="0.5"/>
  <rect x="443" y="178" width="64" height="89" class="room-fill-util" opacity="0.5"/>

  <!-- Top-right: CAFE (biggest space) -->
  <rect x="583" y="73" width="494" height="194" class="room-fill-cafe" opacity="0.5"/>

  <!-- Bottom-left entry + Gallery -->
  <rect x="83" y="273" width="114" height="214" class="room-fill-gallery" opacity="0.5"/>
  <rect x="203" y="273" width="174" height="214" class="room-fill-gallery" opacity="0.6"/>

  <!-- Bottom-center: Storage / Office (attached to cafe) -->
  <rect x="383" y="273" width="154" height="214" class="room-fill-office" opacity="0.4"/>
  <rect x="543" y="273" width="154" height="214" class="room-fill-office" opacity="0.4"/>

  <!-- Bottom-right: Gallery -->
  <rect x="703" y="273" width="374" height="214" class="room-fill-gallery" opacity="0.6"/>

  <!-- ====== ROOM LABELS ====== -->
  <!-- Top-left Gallery -->
  <text x="215" y="165" class="room-label">GALLERY A</text>
  <text x="215" y="180" class="room-sub">Main Exhibition</text>

  <!-- Center small rooms -->
  <text x="395" y="125" class="room-sub">WC</text>
  <text x="395" y="225" class="room-sub">WC</text>
  <text x="475" y="130" class="room-sub">Kitchen</text>
  <text x="475" y="225" class="room-sub">Utility</text>

  <!-- Top-right CAFE -->
  <text x="830" y="165" class="room-label">CAFÉ</text>
  <text x="830" y="182" class="room-sub">Dining &amp; Lounge</text>

  <!-- Bottom-left entry -->
  <text x="140" y="395" class="room-label">HALL</text>
  <text x="140" y="410" class="room-sub">Entry</text>

  <!-- Bottom Gallery (left of storage) -->
  <text x="290" y="385" class="room-label">GALLERY B</text>
  <text x="290" y="400" class="room-sub">Exhibition</text>

  <!-- Storage -->
  <text x="460" y="385" class="room-label">STORAGE</text>
  <text x="460" y="400" class="room-sub"></text>

  <!-- Office -->
  <text x="620" y="385" class="room-label">OFFICE</text>
  <text x="620" y="400" class="room-sub"></text>

  <!-- Bottom-right Gallery -->
  <text x="890" y="385" class="room-label">GALLERY C</text>
  <text x="890" y="400" class="room-sub">Exhibition</text>

  <!-- ====== WALL IDs (for DP) ====== -->
  <text x="215" y="86" class="wall-id">WALL A-N</text>
  <text x="215" y="264" class="wall-id">WALL A-S</text>
  <text x="94" y="175" class="wall-id" transform="rotate(-90, 94, 175)">WALL A-W</text>
  <text x="340" y="175" class="wall-id" transform="rotate(-90, 340, 175)">WALL A-E</text>

  <text x="290" y="284" class="wall-id">WALL B-N</text>
  <text x="290" y="484" class="wall-id">WALL B-S</text>

  <text x="890" y="284" class="wall-id">WALL C-N</text>
  <text x="890" y="484" class="wall-id">WALL C-S</text>
  <text x="714" y="385" class="wall-id" transform="rotate(-90, 714, 385)">WALL C-W</text>
  <text x="1068" y="385" class="wall-id" transform="rotate(-90, 1068, 385)">WALL C-E</text>

  <!-- ====== ENTRANCE MARKERS ====== -->
  <text x="65" y="352" class="room-sub" text-anchor="end" font-weight="700" fill="#cc8855" font-size="8">ENTRANCE</text>
  <text x="1095" y="372" class="room-sub" text-anchor="start" font-weight="700" fill="#cc8855" font-size="8">ENTRANCE</text>

  <!-- ====== TITLE & LEGEND ====== -->
  <text x="80" y="555" class="title-text">ART SPACE BYRON — FLOOR PLAN</text>
  <text x="80" y="572" class="legend-text">44 Byron St, Inverell NSW 2360</text>

  <rect x="640" y="546" width="14" height="14" fill="#f5f2eb" stroke="#ccc" stroke-width="0.8"/>
  <text x="660" y="557" class="legend-text">Gallery</text>

  <rect x="720" y="546" width="14" height="14" fill="#eef2e8" stroke="#ccc" stroke-width="0.8"/>
  <text x="740" y="557" class="legend-text">Café</text>

  <rect x="790" y="546" width="14" height="14" fill="#ebe8f0" stroke="#ccc" stroke-width="0.8"/>
  <text x="810" y="557" class="legend-text">Office / Storage</text>

  <rect x="910" y="546" width="14" height="14" fill="#f0f0f0" stroke="#ccc" stroke-width="0.8"/>
  <text x="930" y="557" class="legend-text">WC / Utility</text>

  <!-- North arrow -->
  <g transform="translate(1050, 545)">
    <polygon points="0,-16 -5,0 0,-5 5,0" fill="#1a1a1a"/>
    <text x="0" y="12" text-anchor="middle" font-size="8" font-weight="700" fill="#1a1a1a">N</text>
  </g>

</svg>
