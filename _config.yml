# Jekyll Gallery Website Configuration
# ART SPACE BYRON

# Site Settings
title: "ART SPACE BYRON"
description: "A contemporary art gallery in Inverell, New England NSW — Korean and Australian contemporary art. Free admission."
baseurl: ""
url: "https://www.artspacebyron.com.au"
repository: "Supermassivema/Supermassivema.github.io"
lang: en
timezone: Australia/Sydney

# Multilingual Support
languages: ["en", "ko"]
default_lang: "en"

# Author/Brand
author:
  name: "ART SPACE BYRON"
  email: "admin@artspacebyron.com.au"

# Social Media
social:
  gallery_instagram: "liminalgallery"

# Build Settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  # sitemap.xml is now a custom template (adds <image:image>); jekyll-sitemap removed to avoid conflict

# Collections Configuration
collections:
  artists:
    output: true
    permalink: /gallery/artists/:title/
  exhibitions:
    output: true
    permalink: /gallery/exhibitions/:title/
  artworks:
    output: true
    permalink: /gallery/collection/:title/

# Collection Defaults
defaults:
  - scope:
      path: ""
      type: "artists"
    values:
      layout: "artist"
      brand: "gallery"
  - scope:
      path: ""
      type: "exhibitions"
    values:
      layout: "exhibition"
      brand: "gallery"
  - scope:
      path: ""
      type: "artworks"
    values:
      layout: "artwork"
      brand: "gallery"
  - scope:
      path: "gallery"
    values:
      layout: "gallery-page"
      brand: "gallery"

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .claude/
  - README.md
  - _templates/
  - _incoming/
  - LICENSE

# Sass Configuration
sass:
  sass_dir: assets/css
  style: compressed

# SEO Settings (Enhanced)
logo: /assets/images/og-image.jpg
favicon: /assets/images/favicon.svg
twitter:
  username: 44BYRON
  card: summary_large_image
image: /assets/images/og-image.jpg

# Social Links
social:
  name: ART SPACE BYRON
  links:
    - https://instagram.com/liminalgallery
